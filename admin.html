<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | مؤسسة الريان</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo-real.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="container admin-header-inner">
    <a href="index.html" class="brand">
      <img src="assets/logo-real.jpg" alt="شعار مؤسسة الريان" class="brand-logo">
      <span class="brand-text">
        <strong>الريان</strong>
        <small>لوحة التحكم</small>
      </span>
    </a>
    <button type="button" class="btn btn-outline" id="logoutBtn" style="display:none;">تسجيل الخروج</button>
  </div>
</header>

<main class="container admin-main">

  <!-- ===== Login ===== -->
  <section class="admin-login" id="loginSection">
    <div class="admin-login-card">
      <h2>تسجيل الدخول</h2>
      <p class="admin-hint">
        الصق هنا GitHub Personal Access Token (fine-grained) الخاص بحسابك، بصلاحية
        <strong>Contents: Read and write</strong> على مستودع <code>rayan</code> فقط.
        <br><strong>هذه الخطوة مرة واحدة فقط</strong> — سيتم حفظ الدخول تلقائيًا على هذا الجهاز والمتصفح.
      </p>
      <div class="form-row">
        <label for="tokenInput">GitHub Token</label>
        <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <button type="button" class="btn btn-primary btn-block" id="loginBtn">دخول</button>
      <p class="admin-error" id="loginError"></p>
    </div>
  </section>

  <!-- ===== Dashboard ===== -->
  <section class="admin-dashboard" id="dashboardSection" style="display:none;">
    <div class="admin-toolbar">
      <h2>إدارة المنتجات</h2>
      <button type="button" class="btn btn-primary" id="saveAllBtn">💾 حفظ كل التغييرات على الموقع</button>
    </div>
    <p class="admin-status" id="statusMsg"></p>

    <div class="admin-products" id="productsList"></div>

    <div class="admin-add-card">
      <h3>➕ إضافة منتج جديد</h3>
      <div class="admin-form-grid">
        <div class="form-row">
          <label>معرف فريد (بالإنجليزية، بدون مسافات)</label>
          <input type="text" id="newId" placeholder="مثال: goat2">
        </div>
        <div class="form-row">
          <label>الاسم</label>
          <input type="text" id="newName" placeholder="مثال: خروف كبير">
        </div>
        <div class="form-row">
          <label>الوسم (Tag)</label>
          <input type="text" id="newTag" placeholder="مثال: عرض خاص">
        </div>
        <div class="form-row">
          <label>السعر (ج.م)</label>
          <input type="number" id="newPrice" placeholder="2800">
        </div>
        <div class="form-row">
          <label>النية الافتراضية</label>
          <select id="newIntention">
            <option value="أضحية">أضحية</option>
            <option value="عقيقة">عقيقة</option>
            <option value="صدقة">صدقة</option>
            <option value="نذر">نذر</option>
          </select>
        </div>
        <div class="form-row">
          <label>الوصف</label>
          <input type="text" id="newDesc" placeholder="وصف قصير للمنتج">
        </div>
        <div class="form-row">
          <label>صورة المنتج</label>
          <input type="file" id="newImage" accept="image/*">
        </div>
      </div>
      <button type="button" class="btn btn-primary" id="addProductBtn">إضافة المنتج</button>
      <p class="admin-error" id="addError"></p>
    </div>
  </section>

</main>

<script src="js/admin.js"></script>
</body>
</html>
